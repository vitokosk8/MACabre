name: Build and release

# Runs the tests on every push and pull request. Builds the Windows, macOS and Linux
# packages on tags (v*) and on manual runs. A tag also publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MACabre and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pyinstaller>=6.6,<7"
      - name: Build bundle
        run: pyinstaller --noconfirm packaging/macabre.spec
        shell: bash
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/MACabre -DestinationPath "dist/release/MACabre-$version-${{ matrix.label }}.zip"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          hdiutil create -volname MACabre -srcfolder dist/MACabre.app -ov -format UDZO \
            "dist/release/MACabre-${version}-${{ matrix.label }}.dmg"
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          tar -czf "dist/release/MACabre-${version}-${{ matrix.label }}.tar.gz" -C dist MACabre
      - uses: actions/upload-artifact@v4
        with:
          name: macabre-${{ matrix.label }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "MACabre $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            --prerelease
